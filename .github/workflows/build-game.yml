name: Build and validate game
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'tests/**'
      - 'build*.mjs'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ironhold-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false jsdom@26
      - run: node build.mjs
      - run: node --test tests/*.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ironhold-game-source
          path: |
            src/
            assets/
            tests/
            index.html
            build*.mjs
            README.md
          retention-days: 7
      - name: Publish generated standalone game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html src/locales.js
          if ! git diff --cached --quiet; then
            git commit -m 'Build standalone game [skip ci]'
            git push
          fi
